# Sample configuration file - copy this to dev.properties, staging.properties, or prod.properties
baseUrl=https://your-application-url.com
browser=chrome
# Available browsers: chrome, firefox, edge
headless=false
remote=false
gridUrl=
windowWidth=1920
windowHeight=1080
# Default wait time in seconds for explicit waits (recommended: 10-60)
timeout=30

# Total time budget in milliseconds for retrying one flaky step/assertion
stepRetryTimeoutMs=5000

# Delay in milliseconds between step retry attempts
stepRetryIntervalMs=500

# Total time budget in milliseconds for verify steps that refresh the page before retrying
pageVerificationRetryTimeoutMs=10000

# Total time budget in milliseconds for retrying a failed test case. 0 disables test retry.
testRetryTimeoutMs=0

# Delay in milliseconds before rerunning a failed test case
testRetryIntervalMs=1000
