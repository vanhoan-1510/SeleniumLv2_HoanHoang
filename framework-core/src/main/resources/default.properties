# Default configuration values
# These values will be overridden by environment-specific properties

# Default timeout in seconds
timeout=10

# Default polling interval in milliseconds
pollingInterval=100

# Default interaction timeout in seconds
interactionTimeout=10

# Default assertion timeout in seconds
assertionTimeout=10

# Default retry timeout in milliseconds for one flaky step/assertion
stepRetryTimeoutMs=5000

# Default delay in milliseconds between step retry attempts
stepRetryIntervalMs=500

# Default retry timeout in milliseconds for verify steps that refresh the page
pageVerificationRetryTimeoutMs=10000

# Default retry timeout in milliseconds for a failed test case. 0 disables test retry.
testRetryTimeoutMs=0

# Default delay in milliseconds before rerunning a failed test case
testRetryIntervalMs=1000

# Default browser configuration
browser=chrome
headless=false
remote=false
gridUrl=
windowWidth=1920
windowHeight=1080
baseUrl=http://localhost:8080
